# Configuration Supabase CLI (généré, ajusté).
# Doc : https://supabase.com/docs/guides/local-development/cli/config

project_id = "cursus"

[api]
enabled = true
port    = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port             = 54322
shadow_port      = 54320
major_version    = 15

[studio]
enabled = true
port    = 54323

[auth]
enabled                = true
site_url               = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry             = 3600
enable_signup          = true
enable_confirmations   = false   # à passer à true en production (vérification email)

[auth.email]
enable_signup       = true
double_confirm_changes = true
enable_confirmations  = false

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.send-document-email]
verify_jwt = true
